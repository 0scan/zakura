[package]
name = "zakura-indexer"
version = "0.1.0"
authors.workspace = true
description = "Explorer response types and canonical-state adapters for the Zakura node"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
state-index = ["dep:zakura-state", "zakura-state/indexer"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["serde_derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["util"] }

zakura-chain = { path = "../zakura-chain", version = "8.0.0" }
zakura-state = { path = "../zakura-state", version = "10.0.0", optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
